name: Test basic file creation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: ''
          file: hello.txt
          content: 'Hello, World!'
      - name: Assert file exists
        run: |
          echo "Checking if hello.txt exists..."
          if [ ! -f "hello.txt" ]; then
            echo "FAIL: hello.txt was not created"
            exit 1
          fi
          echo "PASS: file exists"
      - name: Assert file content
        run: |
          ACTUAL="$(cat hello.txt)"
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "Hello, World!" ]; then
            echo "FAIL: expected 'Hello, World!' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: content matches"
