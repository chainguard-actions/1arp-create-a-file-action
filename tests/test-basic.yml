name: Test basic file creation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: ${{ github.workspace }}
          isAbsolutePath: true
          file: hello.txt
          content: 'Hello, World!'
      - name: Assert file was created
        run: |
          echo "Checking if hello.txt exists..."
          if [ ! -f "$GITHUB_WORKSPACE/hello.txt" ]; then
            echo "FAIL: hello.txt was not created"
            exit 1
          fi
          echo "PASS: file exists"
      - name: Assert file content
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/hello.txt")
          echo "actual content: $CONTENT"
          if [ "$CONTENT" != "Hello, World!" ]; then
            echo "FAIL: expected 'Hello, World!' but got '$CONTENT'"
            exit 1
          fi
          echo "PASS: content matches"
