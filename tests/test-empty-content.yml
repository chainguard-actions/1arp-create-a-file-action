name: Test file creation with empty content
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: 'output'
          file: 'empty.txt'
          content: ''
      - name: Assert file exists and is empty
        run: |
          FILE="output/empty.txt"
          echo "Checking file: $FILE"
          if [ ! -f "$FILE" ]; then
            echo "FAIL: file '$FILE' was not created"
            exit 1
          fi
          CONTENT="$(cat "$FILE")"
          echo "actual content: '$CONTENT'"
          if [ -n "$CONTENT" ]; then
            echo "FAIL: expected empty content but got '$CONTENT'"
            exit 1
          fi
          echo "PASS"
