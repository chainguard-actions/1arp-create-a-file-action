name: Test file creation with empty content
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: ''
          file: empty.txt
          content: ''
      - name: Assert empty file exists
        run: |
          echo "Checking empty file exists..."
          if [ ! -f "$GITHUB_WORKSPACE/empty.txt" ]; then
            echo "FAIL: empty.txt was not created"
            exit 1
          fi
          CONTENT=$(cat "$GITHUB_WORKSPACE/empty.txt")
          echo "actual content: '$CONTENT'"
          if [ -n "$CONTENT" ]; then
            echo "FAIL: expected empty content but got '$CONTENT'"
            exit 1
          fi
          echo "PASS"
