name: Test file creation with empty content
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: ''
          file: empty.txt
          content: ''
      - name: Assert file exists
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/empty.txt" ]; then
            echo "FAIL: expected file empty.txt not found"
            exit 1
          fi
          echo "PASS: file exists"
      - name: Assert file is empty
        run: |
          CONTENT="$(cat "$GITHUB_WORKSPACE/empty.txt")"
          echo "actual content: '$CONTENT'"
          if [ -n "$CONTENT" ]; then
            echo "FAIL: expected empty content but got '$CONTENT'"
            exit 1
          fi
          echo "PASS: file is empty as expected"
