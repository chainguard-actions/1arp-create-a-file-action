name: Test file creation in subdirectory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: ${{ github.workspace }}/output/subdir
          isAbsolutePath: true
          file: result.txt
          content: 'File in subdirectory'
      - name: Assert file was created in subdirectory
        run: |
          echo "Checking if output/subdir/result.txt exists..."
          if [ ! -f "$GITHUB_WORKSPACE/output/subdir/result.txt" ]; then
            echo "FAIL: output/subdir/result.txt was not created"
            exit 1
          fi
          echo "PASS: file exists in subdirectory"
      - name: Assert file content in subdirectory
        run: |
          CONTENT=$(cat "$GITHUB_WORKSPACE/output/subdir/result.txt")
          echo "actual content: $CONTENT"
          if [ "$CONTENT" != "File in subdirectory" ]; then
            echo "FAIL: expected 'File in subdirectory' but got '$CONTENT'"
            exit 1
          fi
          echo "PASS: content matches"
