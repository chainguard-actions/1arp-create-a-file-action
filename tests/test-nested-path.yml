name: Test file creation in nested directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: 'test-output/nested/deep'
          file: 'data.json'
          content: '{"key":"value"}'
      - name: Assert nested file was created
        run: |
          TARGET="test-output/nested/deep/data.json"
          echo "Checking for file: $TARGET"
          if [ ! -f "$TARGET" ]; then
            echo "FAIL: file '$TARGET' was not created"
            exit 1
          fi
          echo "PASS: file exists"
      - name: Assert file content
        run: |
          TARGET="test-output/nested/deep/data.json"
          ACTUAL=$(cat "$TARGET")
          echo "actual content: $ACTUAL"
          if [ "$ACTUAL" != '{"key":"value"}' ]; then
            echo "FAIL: expected '{\"key\":\"value\"}' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
